name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # tests use the offline hashing embedder and no reranker, so the heavy
      # model packages (torch, sentence-transformers) are not needed in CI
      - run: pip install pdfplumber beautifulsoup4 python-dotenv qdrant-client numpy rank-bm25 google-genai fastapi httpx pytest
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm test
